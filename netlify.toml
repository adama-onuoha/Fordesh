# Netlify builds the site from GitHub using these settings.
# The Supabase keys (VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY)
# are not in GitHub; add them in Netlify under Site configuration -> Environment variables.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
